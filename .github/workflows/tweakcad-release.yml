name: TweakCAD release

# Publishes @tweakcad/occt-wasm from a v<upstream>-tweakcad.<n> tag: the package
# is built and tested in the builder image, then published to npm with
# provenance by npm's trusted publishing, so no token is stored anywhere. Run by
# hand with a tag to publish one that was pushed before.
on:
  push:
    tags: ['v*-tweakcad.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v5.17.0-tweakcad.2'
        required: true

permissions:
  contents: read

concurrency:
  group: tweakcad-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # The OCCT libraries and toolchain, pinned by digest.
      image: ghcr.io/andymai/occt-wasm-builder@sha256:15e935ea4c2d5dece5653f5440bd764fa9b57c70a9760b6a3530f6fcb5865f53
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          persist-credentials: false

      - name: Check the tag names the package version
        run: |
          version=$(node -p "require('./ts/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "ts/package.json is $version, the tag is $TAG" >&2
            exit 1
          fi

      - name: Link the prebuilt OCCT libraries
        run: |
          cp -r /workspace/occt/build occt/build
          cp -r /workspace/3rdparty 3rdparty

      - name: Install dependencies
        run: |
          npm ci
          cd ts && npm ci

      - name: Build
        run: cargo xtask build --release

      - name: Pack
        run: |
          cd ts
          npm run build
          cp ../dist/occt-wasm.js ../dist/occt-wasm.wasm dist/
          mkdir -p ../package
          npm pack --pack-destination ../package

      - name: Test
        run: npx vitest run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm takes this package only from this workflow in this environment, which
    # can require an approval first.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # Node 24's npm supports trusted publishing (npm 11.5.1 and later).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # A version already on npm is left as it is, so a run can be repeated.
      # A prerelease version is published only with an explicit dist-tag.
      - name: Publish
        run: |
          version=$(tar -xzOf package/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ -n "$(npm view "@tweakcad/occt-wasm@$version" version 2>/dev/null)" ]; then
            echo "::notice::@tweakcad/occt-wasm@$version is already on npm; nothing published"
            exit 0
          fi
          npm publish package/*.tgz --provenance --access public --tag latest
